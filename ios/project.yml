name: RetroSnakeClassic
options:
  bundleIdPrefix: ai.scaffolde
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  RetroSnakeClassic:
    type: application
    platform: iOS
    sources:
      - path: RetroSnakeClassic
        excludes:
          - GameAssets
      - path: RetroSnakeClassic/GameAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.scaffolde.retrosnakeclassic
        PRODUCT_NAME: RetroSnakeClassic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: RetroSnakeClassic/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 65DX5RCLG7
        GENERATE_INFOPLIST_FILE: NO
schemes:
  RetroSnakeClassic:
    build:
      targets:
        RetroSnakeClassic: all
    run:
      config: Debug
    archive:
      config: Release
